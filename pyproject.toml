[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-boundary-evidence"
version = "0.1.2"
description = "Read-only, deterministic boundary evidence extraction for public GitHub issues"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Issue Boundary Evidence contributors" }]
dependencies = []

[project.urls]
Repository = "https://github.com/LaimaWu/issue-boundary-evidence"
Issues = "https://github.com/LaimaWu/issue-boundary-evidence/issues"

[project.scripts]
issue-boundary-evidence = "issue_boundary_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
